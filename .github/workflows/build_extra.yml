name: Build Extra
on:
  schedule:
    # Nightly master build
    - cron: 0 20 * * *

  workflow_dispatch:
    inputs:
      # trunk-ignore(checkov/CKV_GHA_7)
      meshtastic_firmware_ref:
        description: Meshtastic firmware ref
        required: true
        type: string
        default: master
      create_release:
        description: Create Release
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      meshtastic_firmware_ref:
        description: Meshtastic firmware ref
        required: true
        type: string
      create_release:
        description: Create Release
        required: false
        type: boolean
        default: false

env:
  meshtastic_firmware_ref: ${{ inputs.meshtastic_firmware_ref || 'master' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - id: checkout_meshtastic
        uses: actions/checkout@v5
        name: Checkout Meshtastic firmware
        with:
          repository: meshtastic/firmware
          ref: ${{ env.meshtastic_firmware_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          cache: pip
      - run: pip install -U platformio
      - name: Generate matrix
        id: jsonStep
        run: |
          EXTRA=$(./bin/generate_ci_matrix.py all --level extra)
          MAIN=$(./bin/generate_ci_matrix.py all)
          TARGETS=$(jq -n -c --argjson main "$MAIN" --argjson extra "$EXTRA" '$extra - $main')
          echo "all=$TARGETS" >> $GITHUB_OUTPUT
    outputs:
      all: ${{ steps.jsonStep.outputs.all }}

  version:
    runs-on: ubuntu-latest
    steps:
      - id: checkout_meshtastic
        uses: actions/checkout@v5
        name: Checkout Meshtastic firmware
        with:
          repository: meshtastic/firmware
          ref: ${{ env.meshtastic_firmware_ref }}
      - name: Get release version string
        run: |
          echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT
        id: version
    outputs:
      long: ${{ steps.version.outputs.long }}

  build:
    needs: [setup, version]
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.setup.outputs.all) }}
    uses: ./.github/workflows/build_firmware.yml
    with:
      meshtastic_firmware_ref: ${{ inputs.meshtastic_firmware_ref }}
      version: ${{ needs.version.outputs.long }}
      pio_env: ${{ matrix.build.board }}
      platform: ${{ matrix.build.platform }}

  gather-artifacts:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - esp32
          - esp32s2
          - esp32s3
          - esp32c3
          - esp32c6
          - nrf52840
          - rp2040
          - rp2350
          - stm32
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - id: checkout_meshtastic
        uses: actions/checkout@v5
        name: Checkout Meshtastic firmware
        with:
          repository: meshtastic/firmware
          ref: ${{ env.meshtastic_firmware_ref }}

      - uses: actions/download-artifact@v6
        with:
          path: ./
          pattern: firmware-${{matrix.arch}}-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R

      - name: Move files up
        run: mv -b -t ./ ./bin/device-*.sh ./bin/device-*.bat

      - name: Repackage in single firmware zip
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{matrix.arch}}-${{ needs.version.outputs.long }}
          overwrite: true
          path: |
            ./firmware-*.bin
            ./firmware-*.uf2
            ./firmware-*.hex
            ./firmware-*-ota.zip
            ./device-*.sh
            ./device-*.bat
            ./littlefs-*.bin
            ./bleota*bin
            ./Meshtastic_nRF52_factory_erase*.uf2
          retention-days: 30
